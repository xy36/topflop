# Pflegt einen Release-PR mit Changelog und Versionsnummer. Wird der PR
# gemergt, legt release-please Tag und GitHub-Release an.
# Voraussetzung: Commits im Format „Conventional Commits“ (feat:, fix:, …).
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
