# Maintains a release PR with changelog and version number. When the PR
# is merged, release-please creates the tag and the GitHub release.
# Requires commits in Conventional Commits format (feat:, fix:, …).
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
